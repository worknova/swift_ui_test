name: TDI Glass Capture
on:
  workflow_dispatch:
    inputs:
      make_review_60fps:
        description: 'Also encode review video at 60 FPS (original VFR always retained)'
        type: boolean
        default: false
  push:
    branches: [tdi-system-morph-membrane-20261012]
    paths:
      - '.github/tdi-capture.request'
permissions:
  contents: read
jobs:
  capture:
    runs-on: macos-26
    timeout-minutes: 25
    env:
      TDI_MAKE_REVIEW_60FPS: ${{ inputs.make_review_60fps || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare build and video tools
        shell: bash
        run: |
          mkdir -p tdi-output
          echo "setup_start=$(date +%s)" >> "$GITHUB_ENV"
          command -v xcodegen >/dev/null || brew install xcodegen
          command -v ffmpeg >/dev/null || brew install ffmpeg
          command -v xcodegen
          command -v ffmpeg
          command -v ffprobe
          xcodegen generate --spec project.yml
      - name: Select and boot iOS Simulator
        shell: bash
        run: |
          SIMULATOR_UDID="$(python3 - <<'PY'
          import json,subprocess
          data=json.loads(subprocess.check_output(["xcrun","simctl","list","devices","available","-j"]))
          choices=[]
          for runtime,devices in data["devices"].items():
              if "iOS" not in runtime: continue
              for item in devices:
                  if item.get("isAvailable", True) and item["name"].startswith("iPhone"):
                      choices.append((item["name"]!="iPhone 17",item["name"],item["udid"]))
          if not choices: raise SystemExit("No iOS Simulator")
          choices.sort()
          print(choices[0][2])
          PY
          )"
          test -n "$SIMULATOR_UDID"
          echo "SIMULATOR_UDID=$SIMULATOR_UDID" >> "$GITHUB_ENV"
          echo "Booting simulator: $SIMULATOR_UDID"
          xcrun simctl list devices available | grep -F "$SIMULATOR_UDID"
          echo "simulator_start=$(date +%s)" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIMULATOR_UDID" || true
          # Do not wait here: Xcode can build while the simulator initializes.
      - name: Build native app and XCTest
        shell: bash
        run: |
          build_start=$(date +%s)
          xcodebuild build-for-testing -project TDILab.xcodeproj -scheme TDILab -destination 'generic/platform=iOS Simulator' -derivedDataPath DerivedData -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO > tdi-output/build.log 2>&1 || { tail -n 120 tdi-output/build.log; exit 1; }
          echo "build_seconds=$(( $(date +%s) - build_start ))" >> tdi-output/stage-timings.txt
      - name: Wait for simulator and record four native holds
        shell: bash
        run: |
          set -euo pipefail
          boot_wait_start=$(date +%s)
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          xcrun simctl ui "$SIMULATOR_UDID" appearance dark
          echo "post_build_boot_wait_seconds=$(( $(date +%s) - boot_wait_start ))" >> tdi-output/stage-timings.txt
          capture_start=$(date +%s)
          python3 scripts/record_tdi.py
          echo "capture_seconds=$(( $(date +%s) - capture_start ))" >> tdi-output/stage-timings.txt
      - name: Print timing summary
        if: always()
        shell: bash
        run: |
          if test -f tdi-output/stage-timings.txt; then cat tdi-output/stage-timings.txt; fi
      - name: Upload native recording and audit logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tdi-native-four-hypotheses
          path: tdi-output/
          compression-level: 0
          retention-days: 14
          if-no-files-found: warn
