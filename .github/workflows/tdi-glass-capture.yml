name: TDI Glass Capture
on:
  workflow_dispatch:
  push:
    branches: [tdi-system-morph-membrane-20261012]
    paths:
      - '.github/tdi-capture.request'
permissions:
  contents: read
jobs:
  capture:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare build and video tools
        shell: bash
        run: |
          brew list --versions xcodegen >/dev/null 2>&1 || brew install xcodegen
          brew list --versions ffmpeg >/dev/null 2>&1 || brew install ffmpeg
          command -v xcodegen
          command -v ffmpeg
          command -v ffprobe
          xcodegen generate --spec project.yml
      - name: Select and boot iOS Simulator
        shell: bash
        run: |
          SIMULATOR_UDID="$(python3 - <<'PY'
          import json,subprocess
          data=json.loads(subprocess.check_output(["xcrun","simctl","list","devices","available","-j"]))
          choices=[]
          for runtime,devices in data["devices"].items():
              if "iOS" not in runtime: continue
              for item in devices:
                  if item.get("isAvailable", True) and item["name"].startswith("iPhone"):
                      choices.append((item["name"]!="iPhone 17",item["name"],item["udid"]))
          if not choices: raise SystemExit("No iOS Simulator")
          choices.sort()
          print(choices[0][2])
          PY
          )"
          test -n "$SIMULATOR_UDID"
          echo "SIMULATOR_UDID=$SIMULATOR_UDID" >> "$GITHUB_ENV"
          echo "Booting simulator: $SIMULATOR_UDID"
          xcrun simctl list devices available | grep -F "$SIMULATOR_UDID"
          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          xcrun simctl ui "$SIMULATOR_UDID" appearance dark
      - name: Build native app and XCTest
        shell: bash
        run: |
          mkdir -p tdi-output
          xcodebuild build-for-testing -project TDILab.xcodeproj -scheme TDILab -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" -derivedDataPath DerivedData -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO > tdi-output/build.log 2>&1 || { tail -n 120 tdi-output/build.log; exit 1; }
      - name: Record four real native press interactions
        run: python3 scripts/record_tdi.py
      - name: Upload native recording and audit logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tdi-native-four-hypotheses
          path: tdi-output/
          compression-level: 0
          retention-days: 14
          if-no-files-found: warn
